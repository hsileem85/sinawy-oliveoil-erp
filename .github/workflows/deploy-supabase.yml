name: Deploy Supabase Database & Edge Functions

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'supabase/**'

jobs:
  deploy-supabase:
    runs-on: ubuntu-latest
    # Skip gracefully on push if secrets haven't been added yet
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_SUPABASE_AUTO_DEPLOY == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project & push PostgreSQL migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF secrets. See README.md."
            exit 1
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --include-all

      - name: Deploy EasyOrders & Stock-Feed Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase functions deploy easyorders-webhook --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy stock-feed --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
