name: Supabase Keep-Alive

on:
  schedule:
    # Run every 3 days at 08:00 UTC to prevent Supabase free-tier 7-day inactivity auto-pause
    - cron: '0 8 */3 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase PostgreSQL via PostgREST
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || vars.VITE_SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Missing Supabase URL or key repository secrets."
            echo "Add VITE_SUPABASE_URL & VITE_SUPABASE_ANON_KEY (or SUPABASE_URL & SUPABASE_PUBLISHABLE_KEY) in GitHub Repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          BASE_URL="${SUPABASE_URL%/}"

          # 1. Lightweight query against PostgreSQL via PostgREST (returns [] under RLS with zero data exposure)
          HTTP_STATUS=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" \
            "${BASE_URL}/rest/v1/raw_materials?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Accept: application/json")

          echo "Supabase PostgREST table ping HTTP status: ${HTTP_STATUS}"

          # 2. Fallback to PostgREST root schema query if anon table SELECT is restricted
          if [ "$HTTP_STATUS" -eq 401 ] || [ "$HTTP_STATUS" -eq 403 ]; then
            HTTP_STATUS=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" \
              "${BASE_URL}/rest/v1/" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Accept: application/openapi+json")
            echo "Supabase PostgREST schema ping HTTP status: ${HTTP_STATUS}"
          fi

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Unexpected response body:"
            cat /tmp/resp.txt
            exit 1
          fi

          echo "Keep-alive ping succeeded at $(date -u +"%Y-%m-%dT%H:%M:%SZ")."
